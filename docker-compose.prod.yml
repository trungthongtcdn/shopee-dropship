services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/shopee_reconciliation
      SYNC_WEBHOOK_SECRET: ${SYNC_WEBHOOK_SECRET}
      DASHBOARD_USER: ${DASHBOARD_USER}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      ZALO_BRIDGE_URL: ${ZALO_BRIDGE_URL}
      ZALO_BRIDGE_SECRET: ${ZALO_BRIDGE_SECRET}
      # The site's own address, for the links the bot posts into the Zalo group (the kho gửi page).
      PUBLIC_BASE_URL: https://${DOMAIN}
    depends_on:
      - postgres
    expose:
      - "3000"

  # Same image as `app`, different command — polls the Zalo bridge for the
  # configured group and applies "đã đóng" confirmations. Separate process
  # on purpose (see scripts/zaloPoller.ts's comment) rather than running
  # inside the Next.js server.
  zalo-poller:
    build: .
    restart: unless-stopped
    command: ["npx", "tsx", "scripts/zaloPoller.ts"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/shopee_reconciliation
      ZALO_BRIDGE_URL: ${ZALO_BRIDGE_URL}
      ZALO_BRIDGE_SECRET: ${ZALO_BRIDGE_SECRET}
      PUBLIC_BASE_URL: https://${DOMAIN}
      # What the poller must remember across a crash (files already posted, tries at a confirmation).
      # In the container's writable layer: survives a restart of this container, not a rebuild.
      ZALO_POLLER_STATE_FILE: /tmp/zalo-poller-state.json
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: shopee_reconciliation
    volumes:
      - postgres_data:/var/lib/postgresql/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
